name: CI

on:
  pull_request:
  push:

# A branch only needs its newest commit checked. Without this, pushing three
# times in a minute queues three full runs and the first two are already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Format check
        run: uv format --check --diff

      - name: Type check
        run: uv run --locked pyrefly check --min-severity info
             uv check --locked

      - name: Complexity check
        run: uv run --locked complexipy --suggest-refactors

      - name: Test
        run: uv run --locked pytest -q

      - name: Audit
        run: uv audit --locked
