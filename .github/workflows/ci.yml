name: CI

on:
  pull_request:
  push:
    branches: [master, refactor/jax]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0

      - name: Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"

      - name: Type check
        uses: facebook/pyrefly@main
        with:
          python-version: "3.13"

      - name: Complexity check
        uses: rohaquinlop/complexipy-action@v6.2.0
        with:
          paths: "."

      - name: Test
        run: uv run just test

      - name: Audit
        run: uv run just audit
