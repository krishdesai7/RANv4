name: Release

# One button, one job. Actions tab -> Release -> Run workflow.
#
# rooster reads the PRs merged since the last tag, writes CHANGELOG.md and
# bumps the version; this workflow then re-locks, commits straight to master,
# tags, and cuts the GitHub release.
#
# There is deliberately no release *pull request*. A bot-authored PR cannot be
# opened without either loosening repository settings or minting a PAT, and it
# buys nothing on a repo with one maintainer: the diff is a version string, a
# changelog stanza and a lockfile hash, all of it generated. The master ruleset
# grants the GitHub Actions app (id 15368) a bypass so this job -- and only
# this job -- can push to a branch that otherwise requires a green PR.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (blank = infer from merged PR labels)"
        type: choice
        options: ["", major, minor, patch, pre]
        default: ""
        required: false
      publish_pypi:
        description: "Also publish to PyPI (read the note on the publish step first)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# Two releases at once would race on the tag and on master's ref. Queue them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # rooster diffs against the last tag, so it needs the full history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group release --locked

      - name: Bump version and update changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$BUMP" ]; then
            uv run rooster release --bump "$BUMP"
          else
            uv run rooster release
          fi

      # rooster rewrites the version in pyproject.toml but knows nothing about
      # uv.lock, which pins `ran` by that same version. Without this the release
      # commit fails CI's `uv sync --locked` and has to be fixed up by hand.
      # Bare `uv lock` re-pins only what changed; it does not upgrade deps.
      - name: Re-lock
        run: uv lock

      - name: Read new version
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists -- nothing to release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # rooster curated these notes already; reuse them instead of GitHub's
      # autogenerated commit list. Everything between this version's heading
      # and the next one.
      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "notes<<RELEASE_NOTES_EOF"
            awk -v v="## $VERSION" '$0 == v {f=1; next} f && /^## / {exit} f' CHANGELOG.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          # Push the commit and the tag together: if the ref push is rejected,
          # no tag is left behind pointing at a commit master never got.
          git push origin "HEAD:${{ github.ref_name }}" "refs/tags/$VERSION"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --notes "$NOTES"

      # Off by default. Two things must be true before this can ever succeed:
      #   1. PYPI_TOKEN is set in repository secrets (Settings -> Secrets).
      #   2. The distribution is renamed. `ran` is already taken on PyPI by an
      #      unrelated package (chenshenchao/ran), so uploading under that name
      #      returns 403 no matter whose token is used. Change `name =` in
      #      pyproject.toml to something free -- `ranv4` is not taken.
      - name: Publish to PyPI
        if: inputs.publish_pypi
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
